name = translateClipboard
summary = "Tradução e Área de Transferência"
description = """Addon unificado: tradução de texto (selecionado, clipboard, fala) e gerenciamento de área de transferência com histórico e sons.
Baseado em instantTranslate (Aleksey Sadovoy et al.) e zPortapapeles (Héctor J. Benítez Corredera).
Atualizado e corrigido para NVDA 2023.1 até 2025.x. v1.0.1: corrigido bug que guardava uma função dentro das configurações do NVDA (risco ao salvar) e vazamento de memória no cache de traduções. v1.0.2: tentativa de mover a camada de NVDA+Shift+T pra NVDA+Shift+Y por conflito com o addon terminalAccess. v1.0.3: revertido pra NVDA+Shift+T — o conflito foi resolvido do outro lado, movendo o atalho de nova aba do terminalAccess pra NVDA+Shift+N."""
author = "Leo (baseado em instantTranslate e zPortapapeles)"
url = https://github.com/LeonardoDBernardes/nvda-translate-clipboard
version = 1.0.3
docFileName = readme.html
minimumNVDAVersion = 2023.1
lastTestedNVDAVersion = 2025.3
updateChannel = None
