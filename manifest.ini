name = translateClipboard
summary = "Tradução e Área de Transferência"
description = """Addon unificado: tradução de texto (selecionado, clipboard, fala) e gerenciamento de área de transferência com histórico e sons.
Baseado em instantTranslate (Aleksey Sadovoy et al.) e zPortapapeles (Héctor J. Benítez Corredera).
Atualizado e corrigido para NVDA 2023.1 até 2026.x. v1.0.1: corrigido bug que guardava uma função dentro das configurações do NVDA (risco ao salvar) e vazamento de memória no cache de traduções. v1.0.2: tentativa de mover a camada de NVDA+Shift+T pra NVDA+Shift+Y por conflito com o addon terminalAccess. v1.0.3: revertido pra NVDA+Shift+T — o conflito foi resolvido do outro lado, movendo o atalho de nova aba do terminalAccess pra NVDA+Shift+N. v1.0.4: corrigido pra NVDA 2026.1+ (Python 3.13) — locale.getdefaultlocale() foi removida do Python, trocada por languageHandler.getLanguage(); versionInfo.version_year mudou de módulo pra buildVersion.version_year. v1.0.5: o Google passou a recusar de vez em quando (HTTP 429) o endereço translate.googleapis.com que era o único usado, e o add-on só dizia Falha na tradução; agora tenta vários endereços do Google em sequência, tem tempo limite por pedido, registra no nvda.log o motivo de cada falha, avisa quando o Google limitou as consultas da rede e deixou de desligar a verificação de certificados do NVDA inteiro."""
author = "Leo (baseado em instantTranslate e zPortapapeles)"
url = https://github.com/LeonardoDBernardes/nvda-translate-clipboard
version = 1.0.5
docFileName = readme.html
minimumNVDAVersion = 2023.1
lastTestedNVDAVersion = 2026.2
updateChannel = None
